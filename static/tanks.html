<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Танчики</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#2c3e50;font-family:Arial,sans-serif;touch-action:none;user-select:none}
#gameCanvas{display:block;width:100%;height:calc(100% - 90px)}
#score{position:absolute;top:10px;left:50%;transform:translateX(-50%);color:#fff;font-size:28px;font-weight:bold;text-shadow:2px 2px 4px #000;z-index:10}
#controls{position:absolute;bottom:0;left:0;right:0;height:90px;background:#1a252f;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px}
.btn{background:#34495e;color:#fff;border:none;border-radius:10px;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn:active{background:#5d7a96}
.btn.fire{background:#c0392b;font-size:20px}
.btn.fire:active{background:#e74c3c}
#overlay{position:absolute;inset:0;background:rgba(0,0,0,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:20}
#overlay h1{font-size:36px;margin-bottom:15px}
#overlay p{font-size:20px;margin-bottom:20px}
#overlay button{padding:15px 40px;font-size:20px;background:#27ae60;color:#fff;border:none;border-radius:10px;cursor:pointer}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="score">Счёт: 0</div>
<canvas id="gameCanvas"></canvas>
<div id="controls">
<button class="btn" id="left">◀</button>
<button class="btn fire" id="fire">🔥 ОГОНЬ</button>
<button class="btn" id="right">▶</button>
</div>
<div id="overlay">
<h1>🎮 Танчики</h1>
<p>Двигайся и стреляй!</p>
<button id="startBtn">ИГРАТЬ</button>
</div>
<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),overlay=document.getElementById('overlay');
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}
function resize(){canvas.width=innerWidth;canvas.height=innerHeight-90}
resize();addEventListener('resize',resize);
let player,enemy,shot,score,running,lastShot,spawnT;
function init(){
player={x:canvas.width/2,y:canvas.height-30,w:40,h:25};
enemy={x:Math.random()*(canvas.width-40),y:20,w:40,h:25,dir:1};
shot=[];score=0;running=true;lastShot=0;spawnT=0;
scoreEl.textContent='Счёт: 0'}
function shoot(){if(!running)return;
const now=Date.now();if(now-lastShot<300)return;
lastShot=now;shot.push({x:player.x,y:player.y-15});
if(tg)tg.HapticFeedback.impactOccurred('medium')}
function update(){if(!running)return;
spawnT++;if(spawnT>200){spawnT=0;enemy.y+=30;enemy.dir=Math.random()<.5?-1:1}
enemy.x+=enemy.dir*1.5;
if(enemy.x<0||enemy.x+enemy.w>canvas.width)enemy.dir*=-1;
for(const s of shot)s.y-=6;
shot=shot.filter(s=>s.y>0);
for(const s of shot){if(s.x>enemy.x&&s.x<enemy.x+enemy.w&&s.y>enemy.y&&s.y<enemy.y+enemy.h){
shot=shot.filter(x=>x!==s);score+=10;scoreEl.textContent='Счёт: '+score;
enemy={x:Math.random()*(canvas.width-40),y:20,w:40,h:25,dir:Math.random()<.5?-1:1};
spawnT=0;if(tg)tg.HapticFeedback.notificationOccurred('success');break}}
if(enemy.y+enemy.h>player.y){end()}}
function drawTank(x,y,w,h,color){
ctx.fillStyle=color;ctx.fillRect(x-w/2,y-h/2,w,h);
ctx.fillStyle='#222';ctx.fillRect(x-w/2-3,y+h/2-5,6,8);ctx.fillRect(x+w/2-3,y+h/2-5,6,8);
ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y-2,w/4,0,7);ctx.fill();
ctx.fillRect(x-3,y-h/2-12,6,12)}
function draw(){ctx.fillStyle='#34495e';ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.strokeStyle='#2c3e50';ctx.lineWidth=2;
for(let i=0;i<canvas.width;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,canvas.height);ctx.stroke()}
for(let i=0;i<canvas.height;i+=40){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(canvas.width,i);ctx.stroke()}
drawTank(enemy.x+enemy.w/2,enemy.y+enemy.h/2,enemy.w,enemy.h,'#c0392b');
drawTank(player.x,player.y,player.w,player.h,'#27ae60');
ctx.fillStyle='#f1c40f';
for(const s of shot){ctx.beginPath();ctx.arc(s.x,s.y,4,0,7);ctx.fill()}}
function end(){running=false;if(tg)tg.HapticFeedback.notificationOccurred('error');
overlay.innerHTML=`<h1>💀 Игра окончена!</h1><p>Счёт: ${score}</p><button id="rbtn">ЗАНОВО</button>`;
overlay.classList.remove('hidden');
document.getElementById('rbtn').onclick=start}
function start(){init();overlay.classList.add('hidden');loop()}
function loop(){if(!running)return;update();draw();requestAnimationFrame(loop)}
let moveL=false,moveR=false;
function bindBtn(id,fn){const b=document.getElementById(id);
b.addEventListener('touchstart',e=>{e.preventDefault();fn(true)});
b.addEventListener('touchend',e=>{e.preventDefault();fn(false)});
b.addEventListener('mousedown',()=>fn(true));
b.addEventListener('mouseup',()=>fn(false))}
bindBtn('left',v=>moveL=v);
bindBtn('right',v=>moveR=v);
document.getElementById('fire').addEventListener('touchstart',e=>{e.preventDefault();shoot()});
document.getElementById('fire').addEventListener('mousedown',shoot);
setInterval(()=>{if(!running)return;
if(moveL)player.x-=4;if(moveR)player.x+=4;
player.x=Math.max(20,Math.min(canvas.width-20,player.x))},30);
document.getElementById('startBtn').onclick=start;
init();running=false;draw();
</script>
</body>
</html>
