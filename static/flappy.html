<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flappy Bird</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#4ec0ca;font-family:Arial,sans-serif;touch-action:manipulation;user-select:none}
#gameCanvas{display:block;width:100%;height:100%}
#score{position:absolute;top:30px;left:50%;transform:translateX(-50%);color:#fff;font-size:60px;font-weight:bold;text-shadow:3px 3px 6px rgba(0,0,0,.5);z-index:10;pointer-events:none}
#overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:20;padding:20px}
#overlay h1{font-size:42px;margin-bottom:15px;text-align:center}
#overlay p{font-size:22px;margin-bottom:25px;text-align:center}
#overlay button{padding:18px 50px;font-size:24px;font-weight:bold;background:#4CAF50;color:#fff;border:none;border-radius:12px;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,.3)}
#overlay button:active{background:#45a049;transform:scale(.95)}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="score">0</div>
<canvas id="gameCanvas"></canvas>
<div id="overlay">
<h1>🐦 Flappy Bird</h1>
<p>Тапай чтобы лететь</p>
<button id="startBtn">ИГРАТЬ</button>
</div>
<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),overlay=document.getElementById('overlay');
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
resize();addEventListener('resize',resize);
let bird,pipes,score,running,frame,animId;
const G=.5,J=-8,PS=3;let PG,PW,PI;
function init(){PG=canvas.height*.25;PW=canvas.width*.12;PI=100;
bird={x:canvas.width*.2,y:canvas.height/2,vy:0,r:Math.min(canvas.width,canvas.height)*.04};
pipes=[];score=0;frame=0;scoreEl.textContent='0'}
function jump(){if(!running)return;bird.vy=J;if(tg)tg.HapticFeedback.impactOccurred('light')}
function addPipe(){const mn=PG+50,mx=canvas.height-PG-50;const gy=Math.random()*(mx-mn)+mn;
pipes.push({x:canvas.width,gapY:gy-PG/2,passed:false})}
function update(){if(!running)return;frame++;bird.vy+=G;bird.y+=bird.vy;
if(frame%PI===0)addPipe();
for(const p of pipes){p.x-=PS;if(!p.passed&&p.x+PW<bird.x){p.passed=true;score++;scoreEl.textContent=score;if(tg)tg.HapticFeedback.notificationOccurred('success')}}
pipes=pipes.filter(p=>p.x+PW>-10);
if(bird.y+bird.r>canvas.height||bird.y-bird.r<0)end();
for(const p of pipes){if(bird.x+bird.r>p.x&&bird.x-bird.r<p.x+PW){if(bird.y-bird.r<p.gapY||bird.y+bird.r>p.gapY+PG)end()}}}
function draw(){const g=ctx.createLinearGradient(0,0,0,canvas.height);
g.addColorStop(0,'#4ec0ca');g.addColorStop(.7,'#87ceeb');g.addColorStop(1,'#ded895');
ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.fillStyle='rgba(255,255,255,.7)';
for(let i=0;i<3;i++){const cx=((frame*.3+i*180)%(canvas.width+120))-60,cy=60+i*50;
ctx.beginPath();ctx.arc(cx,cy,25,0,7);ctx.arc(cx+22,cy-5,30,0,7);ctx.arc(cx+48,cy,25,0,7);ctx.fill()}
for(const p of pipes){const gg=ctx.createLinearGradient(p.x,0,p.x+PW,0);
gg.addColorStop(0,'#5cb85c');gg.addColorStop(.5,'#73d673');gg.addColorStop(1,'#4a9d4a');
ctx.fillStyle=gg;
ctx.fillRect(p.x,0,PW,p.gapY);ctx.fillRect(p.x-4,p.gapY-20,PW+8,20);
ctx.fillRect(p.x,p.gapY+PG,PW,canvas.height);ctx.fillRect(p.x-4,p.gapY+PG,PW+8,20)}
ctx.save();ctx.translate(bird.x,bird.y);
ctx.rotate(Math.min(Math.max(bird.vy*.05,-.5),.8));
ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(0,0,bird.r,0,7);ctx.fill();
ctx.strokeStyle='#cc9900';ctx.lineWidth=2;ctx.stroke();
ctx.fillStyle='#ffaa00';ctx.beginPath();ctx.ellipse(-bird.r*.3,bird.r*.1,bird.r*.5,bird.r*.3,0,0,7);ctx.fill();
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bird.r*.4,-bird.r*.3,bird.r*.35,0,7);ctx.fill();
ctx.fillStyle='#000';ctx.beginPath();ctx.arc(bird.r*.5,-bird.r*.3,bird.r*.15,0,7);ctx.fill();
ctx.fillStyle='#ff6b35';ctx.beginPath();ctx.moveTo(bird.r*.8,0);ctx.lineTo(bird.r*1.3,-bird.r*.15);ctx.lineTo(bird.r*1.3,bird.r*.15);ctx.closePath();ctx.fill();
ctx.restore()}
function end(){running=false;if(animId)cancelAnimationFrame(animId);
if(tg)tg.HapticFeedback.notificationOccurred('error');
overlay.innerHTML=`<h1>💀 Игра окончена!</h1><p>Счёт: ${score}</p><button id="rbtn">ЗАНОВО</button>`;
overlay.classList.remove('hidden');
document.getElementById('rbtn').onclick=start}
function start(){init();running=true;overlay.classList.add('hidden');loop()}
function loop(){if(!running)return;update();draw();animId=requestAnimationFrame(loop)}
canvas.addEventListener('touchstart',e=>{e.preventDefault();if(running)jump()},{passive:false});
canvas.addEventListener('mousedown',e=>{if(running)jump()});
document.getElementById('startBtn').onclick=start;
init();draw();
</script>
</body>
</html>
