<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #4ec0ca;
            font-family: Arial, sans-serif;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        #gameContainer {
            position: relative;
            width: 100%; height: 100%;
        }
        #gameCanvas {
            display: block;
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, #4ec0ca 0%, #87ceeb 70%, #ded895 100%);
        }
        #score {
            position: absolute;
            top: 30px; left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 60px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            z-index: 10;
            pointer-events: none;
        }
        #overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 20;
            padding: 20px;
        }
        #overlay h1 { font-size: 42px; margin-bottom: 15px; text-align: center; }
        #overlay p { font-size: 22px; margin-bottom: 25px; text-align: center; }
        #overlay button {
            padding: 18px 50px;
            font-size: 24px;
            font-weight: bold;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        #overlay button:active { background: #45a049; transform: scale(0.95); }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="score">0</div>
        <canvas id="gameCanvas"></canvas>
        
        <div id="overlay">
            <h1>🐦 Flappy Bird</h1>
            <p>Тапай по экрану чтобы лететь</p>
            <button id="startBtn">ИГРАТЬ</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('startBtn');
        
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        let bird, pipes, score, gameRunning, frame, animId;
        const GRAVITY = 0.5;
        const JUMP = -8;
        const PIPE_SPEED = 3;
        let PIPE_GAP, PIPE_WIDTH, PIPE_INTERVAL;
        
        function initGame() {
            PIPE_GAP = canvas.height * 0.25;
            PIPE_WIDTH = canvas.width * 0.12;
            PIPE_INTERVAL = 100;
            
            bird = { 
                x: canvas.width * 0.2, 
                y: canvas.height / 2, 
                vy: 0, 
                radius: Math.min(canvas.width, canvas.height) * 0.04 
            };
            pipes = [];
            score = 0;
            frame = 0;
            scoreEl.textContent = '0';
        }
        
        function jump() {
            if (!gameRunning) return;
            bird.vy = JUMP;
            if (tg) tg.HapticFeedback.impactOccurred('light');
        }
        
        function addPipe() {
            const minGap = PIPE_GAP + 50;
            const maxGap = canvas.height - PIPE_GAP - 50;
            const gapY = Math.random() * (maxGap - minGap) + minGap;
            pipes.push({ x: canvas.width, gapY: gapY - PIPE_GAP/2, passed: false });
        }
        
        function update() {
            if (!gameRunning) return;
            frame++;
            bird.vy += GRAVITY;
            bird.y += bird.vy;
            
            if (frame % PIPE_INTERVAL === 0) addPipe();
            
            for (let pipe of pipes) {
                pipe.x -= PIPE_SPEED;
                if (!pipe.passed && pipe.x + PIPE_WIDTH < bird.x) {
                    pipe.passed = true;
                    score++;
                    scoreEl.textContent = score;
                    if (tg) tg.HapticFeedback.notificationOccurred('success');
                }
            }
            
            pipes = pipes.filter(p => p.x + PIPE_WIDTH > -10);
            
            if (bird.y + bird.radius > canvas.height || bird.y - bird.radius < 0) {
                endGame();
            }
            
            for (let pipe of pipes) {
                if (bird.x + bird.radius > pipe.x && bird.x - bird.radius < pipe.x + PIPE_WIDTH) {
                    if (bird.y - bird.radius < pipe.gapY || bird.y + bird.radius > pipe.gapY + PIPE_GAP) {
                        endGame();
                    }
                }
            }
        }
        
        function draw() {
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#4ec0ca');
            gradient.addColorStop(0.7, '#87ceeb');
            gradient.addColorStop(1, '#ded895');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            for (let i = 0; i < 3; i++) {
                const cx = ((frame * 0.3 + i * 180) % (canvas.width + 120)) - 60;
                const cy = 60 + i * 50;
                ctx.beginPath();
                ctx.arc(cx, cy, 25, 0, Math.PI * 2);
                ctx.arc(cx + 22, cy - 5, 30, 0, Math.PI * 2);
                ctx.arc(cx + 48, cy, 25, 0, Math.PI * 2);
                ctx.fill();
            }
            
            for (let pipe of pipes) {
                const grad1 = ctx.createLinearGradient(pipe.x, 0, pipe.x + PIPE_WIDTH, 0);
                grad1.addColorStop(0, '#5cb85c');
                grad1.addColorStop(0.5, '#73d673');
                grad1.addColorStop(1, '#4a9d4a');
                ctx.fillStyle = grad1;
                ctx.fillRect(pipe.x, 0, PIPE_WIDTH, pipe.gapY);
                ctx.fillRect(pipe.x - 4, pipe.gapY - 20, PIPE_WIDTH + 8, 20);
                ctx.fillRect(pipe.x, pipe.gapY + PIPE_GAP, PIPE_WIDTH, canvas.height);
                ctx.fillRect(pipe.x - 4, pipe.gapY + PIPE_GAP, PIPE_WIDTH + 8, 20);
            }
            
            ctx.save();
            ctx.translate(bird.x, bird.y);
            const angle = Math.min(Math.max(bird.vy * 0.05, -0.5), 0.8);
            ctx.rotate(angle);
            
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#cc9900';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.fillStyle = '#ffaa00';
            ctx.beginPath();
            ctx.ellipse(-bird.radius*0.3, bird.radius*0.1, bird.radius*0.5, bird.radius*0.3, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(bird.radius*0.4, -bird.radius*0.3, bird.radius*0.35, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(bird.radius*0.5, -bird.radius*0.3, bird.radius*0.15, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#ff6b35';
            ctx.beginPath();
            ctx.moveTo(bird.radius*0.8, 0);
            ctx.lineTo(bird.radius*1.3, -bird.radius*0.15);
            ctx.lineTo(bird.radius*1.3, bird.radius*0.15);
            ctx.closePath();
            ctx.fill();
            
            ctx.restore();
        }
        
        function endGame() {
            gameRunning = false;
            if (animId) cancelAnimationFrame(animId);
            if (tg) tg.HapticFeedback.notificationOccurred('error');
            
            overlay.innerHTML = `
                <h1>💀 Игра окончена!</h1>
                <p>Счёт: ${score}</p>
                <button id="restartBtn">ЗАНОВО</button>
            `;
            overlay.classList.remove('hidden');
            document.getElementById('restartBtn').addEventListener('click', startGame);
        }
        
        function startGame() {
            initGame();
            gameRunning = true;
            overlay.classList.add('hidden');
            loop();
        }
        
        function loop() {
            if (!gameRunning) return;
            update();
            draw();
            animId = requestAnimationFrame(loop);
        }
        
        function handleTap(e) {
            e.preventDefault();
            if (gameRunning) jump();
        }
        
        canvas.addEventListener('mousedown', handleTap);
        canvas.addEventListener('touchstart', handleTap, {passive: false});
        startBtn.addEventListener('click', startGame);
        
        // Рисуем начальный экран (без скрытия overlay!)
        initGame();
        draw();
    </script>
</body>
</html>
