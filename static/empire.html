<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Империя: Армия</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#0f1218;color:#e6e9ef;padding-bottom:28px;user-select:none;-webkit-user-select:none;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:20;background:#161b24;border-bottom:1px solid #26303f;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.res-bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px}
.chip{display:flex;align-items:center;gap:4px;height:28px;background:#1e2531;border:1px solid #2c3648;border-radius:8px;padding:0 8px;font-size:13px;line-height:1}
.chip b{font-weight:700;color:#fff;min-width:34px;text-align:right}
.chip .cap{color:#7c8798;font-size:11px;min-width:26px}
.rate{font-size:11px;font-weight:700}
.rate.pos{color:#4ade80}
.rate.neg{color:#f87171}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 10px 8px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:#1a202b;border:1px solid #2c3648;color:#9aa7b8;padding:7px 12px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,color .15s;white-space:nowrap}
.tab.active{background:#2563eb;border-color:#3b82f6;color:#fff;box-shadow:0 0 12px rgba(59,130,246,.45)}
main{padding:10px}
.section-title{font-size:13px;font-weight:700;color:#8fa2ba;margin:2px 0 9px;text-transform:uppercase;letter-spacing:.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:9px;align-items:start}
.card{background:#161b24;border:1px solid #26303f;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.card.anim{animation:pop .16s ease-out}
@keyframes pop{from{opacity:.45;transform:translateY(5px)}to{opacity:1;transform:none}}
.card.locked{opacity:.55;border-style:dashed}
.card-head{display:flex;align-items:center;gap:6px}
.card-head .icon{font-size:18px;line-height:1}
.card-head .title{font-weight:700;font-size:13.5px;flex:1}
.card-head .lvl{font-size:11px;background:#232c3a;color:#8fa2ba;border-radius:6px;padding:2px 6px;font-weight:700;white-space:nowrap}
.desc{font-size:11.5px;color:#8290a3;line-height:1.35}
.prod{font-size:11.5px;color:#4ade80;font-weight:600}
.prod.dim{color:#64748b;font-weight:500}
.cost{display:flex;flex-wrap:wrap;gap:5px;font-size:11.5px}
.cost span{background:#1e2531;border-radius:6px;padding:2px 6px}
.ok{color:#9fb0c4}
.bad{color:#f87171;font-weight:700}
.weap{display:flex;gap:5px;flex-wrap:wrap;font-size:11.5px}
.weap span{background:#1e2531;border-radius:6px;padding:2px 6px}
.req{font-size:11.5px;color:#f59e0b}
.maxed{font-size:11.5px;color:#f59e0b;font-weight:600}
.btn{width:100%;height:34px;border:none;border-radius:9px;font-size:12.5px;font-weight:700;color:#fff;cursor:pointer;margin-top:auto;background:linear-gradient(180deg,#2563eb,#1d4ed8);transition:filter .12s}
.btn:active{filter:brightness(1.15)}
.btn:disabled{background:#232c3a;color:#5a6a80;cursor:not-allowed;filter:none}
.btn.green{background:linear-gradient(180deg,#16a34a,#15803d)}
.btn.red{background:linear-gradient(180deg,#dc2626,#b91c1c)}
.rows{background:#161b24;border:1px solid #26303f;border-radius:12px;padding:2px 12px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #212a38;font-size:13px}
.row:last-child{border:none}
.row span:last-child{font-weight:700;color:#fff}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(90px);background:#1e2531;border:1px solid #3b82f6;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;z-index:100;max-width:88%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.build-header{display:flex;align-items:center;gap:10px;padding:10px;background:#161b24;border:1px solid #26303f;border-radius:12px;margin-bottom:12px}
.back-btn{background:#1e2531;border:1px solid #2c3648;color:#9aa7b8;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.back-btn:active{background:#2c3648}
.build-title{flex:1;font-weight:700;font-size:15px}
.build-level{color:#4ade80;font-weight:700;font-size:13px}
.stage-info{background:#161b24;border:1px solid #26303f;border-radius:12px;padding:12px;margin-bottom:12px;text-align:center}
.stage-name-big{font-size:16px;font-weight:700;color:#e6e9ef;margin-bottom:4px}
.stage-hint{font-size:12px;color:#8290a3;margin-bottom:6px}
.stage-progress{font-size:13px;font-weight:700;color:#3b82f6}
.build-svg-wrap{background:#0b0f15;border:1px solid #26303f;border-radius:12px;padding:8px;max-width:420px;margin:0 auto;transition:border-color .3s,box-shadow .3s}
.build-svg-wrap.complete{border-color:#22c55e;box-shadow:0 0 24px rgba(34,197,94,.5)}
.build-svg-wrap svg{width:100%;height:auto;display:block}
.stage-done-msg{text-align:center;color:#4ade80;font-weight:700;font-size:14px;margin-top:12px}
.waiting-msg{text-align:center;color:#fbbf24;font-weight:600;font-size:13px;margin-top:12px}
.card.conquered{opacity:.65;border-color:#166534}
.card.conquered .title{color:#4ade80}
.battle-header{display:flex;align-items:center;gap:10px;padding:10px;background:#161b24;border:1px solid #26303f;border-radius:12px;margin-bottom:10px}
.battle-stats{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.side{flex:1;background:#161b24;border:1px solid #26303f;border-radius:10px;padding:8px;text-align:center}
.side.player{border-color:#1e40af}
.side.enemy{border-color:#7f1d1d}
.side-label{font-size:11px;color:#8290a3;text-transform:uppercase;font-weight:700}
.side-count{font-size:22px;font-weight:800;color:#fff}
.side.player .side-count{color:#60a5fa}
.side.enemy .side-count{color:#f87171}
.vs{font-weight:800;color:#fbbf24;font-size:14px}
.battle-canvas{display:block;width:100%;max-width:420px;margin:0 auto;border:1px solid #26303f;border-radius:12px;background:#0f172a;box-shadow:0 0 24px rgba(0,0,0,.4);touch-action:none}
.battle-result{margin-top:12px;padding:14px;border-radius:12px;text-align:center;font-size:20px;font-weight:800}
.battle-result.win{background:#14532d;border:1px solid #22c55e;color:#4ade80}
.battle-result.lose{background:#450a0a;border:1px solid #ef4444;color:#f87171}
.battle-result-detail{font-size:12.5px;font-weight:600;color:#cbd5e1;margin:8px 0 12px}
.battle-commands{margin-top:8px;background:#161b24;border:1px solid #26303f;border-radius:10px;padding:8px}
.cmd-info{font-size:12px;color:#8290a3;margin-bottom:6px;font-weight:600}
.cmd-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.cmd-grid .btn{height:34px;margin:0;font-size:12px}
.battle-hint{font-size:11.5px;color:#64748b;text-align:center;margin:8px 2px 0;line-height:1.4}
.build-badge{display:inline-block;font-size:11px;background:#3f1d1d;color:#fca5a5;border-radius:6px;padding:2px 6px;font-weight:700}
</style>
</head>
<body>
<header>
<div class="res-bar" id="resBar"></div>
<nav id="tabs"></nav>
</header>
<main id="content"></main>
<div id="toast"></div>

<script>
// ===== ДАННЫЕ (из data.js, исправлены опечатки) =====
const SAVE_KEY='army_empire_save_v2';
const STAGE_POINTS=[6,4,4,4,6,6];
const RES_META={wood:{icon:'🪵',name:'Древо'},stone:{icon:'🪨',name:'Камень'},iron:{icon:'⛓️',name:'Железо'},food:{icon:'🌾',name:'Еда'},gold:{icon:'💰',name:'Золото'},people:{icon:'👥',name:'Люди'}};
const BUILDINGS={sawmill:{name:'Лесопилка',icon:'🌲',desc:'Добывает древесину',max:20,req:null,base:{wood:30,stone:20},prod:{wood:1.5}},quarry:{name:'Каменоломня',icon:'🪨',desc:'Добывает камень',max:20,req:null,base:{wood:50,gold:25},prod:{stone:1.2}},farm:{name:'Ферма',icon:'🌾',desc:'Производит еду',max:25,req:null,base:{wood:40,gold:20},prod:{food:2.5}},market:{name:'Рынок',icon:'💰',desc:'Приносит золото',max:20,req:{sawmill:1},base:{wood:60,stone:50},prod:{gold:1.5}},house:{name:'Дом',icon:'🏠',desc:'+10 к лимиту населения',max:25,req:{sawmill:1},base:{wood:80,stone:50,gold:30}},mine:{name:'Рудник',icon:'⛏️',desc:'Добывает железо',max:20,req:{quarry:2},base:{wood:120,stone:100},prod:{iron:0.8}},barracks:{name:'Казарма',icon:'🛡️',desc:'Позволяет обучать войска',max:12,req:{quarry:1},base:{wood:150,stone:100,gold:100}},forge:{name:'Кузница',icon:'⚒️',desc:'Позволяет ковать оружие',max:12,req:{mine:1},base:{wood:120,stone:150,iron:20}}};
const WEAPONS={sword:{name:'Меч',icon:'🗡️',cost:{iron:4,gold:8},req:{forge:1}},bow:{name:'Лук',icon:'🏹',cost:{wood:8,gold:6},req:{forge:1}},armor:{name:'Броня',icon:'🛡️',cost:{iron:8,gold:15},req:{forge:2}},cannon:{name:'Пушка',icon:'💣',cost:{iron:25,gold:50},req:{forge:4}}};
const UNITS={inf:{name:'Пехотинец',icon:'🗡️',desc:'Дешёвый и надёжный боец',cost:{gold:30,food:10,people:1},weapons:{sword:1},req:{barracks:1},eat:0.3},arc:{name:'Лучник',icon:'🏹',desc:'Дальний бой',cost:{gold:40,food:10,people:1},weapons:{bow:1},req:{barracks:1},eat:0.3},kn:{name:'Рыцарь',icon:'⚔️',desc:'Тяжёлая пехота',cost:{gold:100,food:25,people:2},weapons:{sword:2,armor:1},req:{barracks:3},eat:0.6},tank:{name:'Танк',icon:'🚜',desc:'Бронированная техника',cost:{gold:350,food:50,people:4,iron:30},weapons:{cannon:1,armor:2},req:{barracks:5,forge:3},eat:1.5}};
const SHOP=[{res:'food',amount:50,price:40,icon:'🌾'},{res:'wood',amount:30,price:25,icon:'🪵'},{res:'stone',amount:30,price:25,icon:'🪨'},{res:'iron',amount:10,price:30,icon:'⛓️'}];
const TABS=[{id:'build',name:'🏗️ Стройка'},{id:'army',name:'⚔️ Армия'},{id:'forge',name:'⚒️ Кузница'},{id:'world',name:'🌍 Мир'},{id:'market',name:'🛒 Рынок'},{id:'info',name:'📊 Империя'}];
const STAGES=[{name:'Арматура фундамента',icon:'🔩',part:0.15},{name:'Заливка фундамента',icon:'🧱',part:0.15},{name:'Арматура колонн',icon:'🔗',part:0.15},{name:'Заливка колонн',icon:'🏗️',part:0.20},{name:'Стены и перекрытия',icon:'🧱',part:0.20},{name:'Крыша и отделка',icon:'🏠',part:0.15}];
const STAGE_HINTS=['Нажми на каждую арматурину','Нажми на каждый участок','Нажми на каждый стержень','Нажми на каждую колонну','Нажми на каждую дощечку','Нажми на каждый элемент кровли'];
const STATES=[{id:'bandits',name:'Лагерь разбойников',icon:'🏴',desc:'Небольшая банда',minArmy:2,enemyArmy:{inf:3},reward:{gold:150,food:80}},{id:'fortress',name:'Пограничная крепость',icon:'🏰',desc:'Укреплённый форпост',minArmy:6,enemyArmy:{inf:5,arc:3},reward:{gold:400,stone:200}},{id:'kingdom',name:'Королевство Астрия',icon:'👑',desc:'Богатое королевство',minArmy:12,enemyArmy:{inf:8,arc:5,kn:2},reward:{gold:1000,iron:150}},{id:'empire',name:'Империя Тьмы',icon:'🦅',desc:'Могущественная держава',minArmy:20,enemyArmy:{inf:12,arc:8,kn:5,tank:2},reward:{gold:3000,iron:600,stone:800}}];
const COMBAT_STATS={inf:{hp:30,dmg:6,speed:25,range:18,radius:6,atkSpeed:1.0,playerColor:'#3b82f6',enemyColor:'#ef4444'},arc:{hp:18,dmg:9,speed:20,range:90,radius:5,atkSpeed:1.2,playerColor:'#06b6d4',enemyColor:'#f97316'},kn:{hp:60,dmg:12,speed:22,range:22,radius:8,atkSpeed:1.1,playerColor:'#8b5cf6',enemyColor:'#dc2626'},tank:{hp:150,dmg:25,speed:14,range:70,radius:12,atkSpeed:1.5,playerColor:'#1d4ed8',enemyColor:'#7f1d1d'}};
const BUILDING_SHAPES={sawmill:'wooden',farm:'wooden',house:'house',quarry:'stone',market:'stone',mine:'stone',barracks:'barracks',forge:'stone'};
const STATE_LAYOUTS={bandits:{gate:{x:0,y:150,w:360,h:18,hp:200},towers:[],enemies:[{type:'inf',x:150,y:100},{type:'inf',x:180,y:100},{type:'inf',x:210,y:110}]},fortress:{gate:{x:0,y:145,w:360,h:22,hp:500},towers:[{x:60,y:105,w:36,h:52,hp:280,range:110,dmg:8,atkSpeed:1.4},{x:264,y:105,w:36,h:52,hp:280,range:110,dmg:8,atkSpeed:1.4}],enemies:[{type:'inf',x:150,y:100},{type:'inf',x:180,y:100},{type:'inf',x:210,y:110},{type:'arc',x:120,y:70},{type:'arc',x:240,y:70}]},kingdom:{gate:{x:0,y:140,w:360,h:24,hp:1000},towers:[{x:45,y:100,w:38,h:56,hp:500,range:120,dmg:12,atkSpeed:1.3},{x:277,y:100,w:38,h:56,hp:500,range:120,dmg:12,atkSpeed:1.3}],enemies:[{type:'inf',x:130,y:100},{type:'inf',x:160,y:100},{type:'inf',x:190,y:100},{type:'inf',x:220,y:100},{type:'arc',x:140,y:70},{type:'arc',x:180,y:60},{type:'arc',x:220,y:70},{type:'kn',x:150,y:120},{type:'kn',x:200,y:120}]},empire:{gate:{x:0,y:140,w:360,h:28,hp:2000},towers:[{x:30,y:90,w:40,h:60,hp:800,range:130,dmg:15,atkSpeed:1.2},{x:160,y:70,w:40,h:62,hp:900,range:130,dmg:15,atkSpeed:1.2},{x:290,y:90,w:40,h:60,hp:800,range:130,dmg:15,atkSpeed:1.2}],enemies:[{type:'inf',x:130,y:110},{type:'inf',x:160,y:110},{type:'inf',x:190,y:110},{type:'inf',x:220,y:110},{type:'arc',x:130,y:70},{type:'arc',x:180,y:50},{type:'arc',x:220,y:70},{type:'kn',x:140,y:130},{type:'kn',x:170,y:120},{type:'kn',x:200,y:130},{type:'tank',x:180,y:100}]}};

// ===== ЛОГИКА (из game.js, исправлены все опечатки) =====
let state=loadState()||newState();
let activeTab='build',buildView=null,battleView=null,battleRAF=null,dirty=true,animate=true,lastT=performance.now(),starveTimer=0;

function newState(){return{res:{wood:250,stone:200,iron:0,food:250,gold:500,people:5},buildings:{sawmill:0,quarry:0,farm:0,market:0,house:0,mine:0,barracks:0,forge:0},build:{},army:{inf:0,arc:0,kn:0,tank:0},weapons:{sword:0,bow:0,armor:0,cannon:0},conquered:[],defendWins:0}}
function loadState(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return null;const s=JSON.parse(raw);const d=newState();const build=s.build||{};for(const k in build){const c=build[k];if(!Array.isArray(c.done))c.done=[];if(typeof c.stage!=='number')c.stage=0;}return{res:Object.assign(d.res,s.res||{}),buildings:Object.assign(d.buildings,s.buildings||{}),build,army:Object.assign(d.army,s.army||{}),weapons:Object.assign(d.weapons,s.weapons||{}),conquered:s.conquered||[],defendWins:s.defendWins||0}}catch(e){return null}}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){}}
function fmt(n){return n>=100000?Math.floor(n/1000)+'k':Math.floor(n)}
function fmtRate(n){return(n>=0?'+':'')+n.toFixed(1)}
function canPay(c){for(const k in c)if((state.res[k]||0)<c[k])return false;return true}
function pay(c){for(const k in c)state.res[k]=(state.res[k]||0)-c[k]}
function checkReq(r){if(!r)return true;for(const k in r)if((state.buildings[k]||0)<r[k])return false;return true}
function reqText(r){if(!r)return'';return Object.entries(r).map(([k,v])=>BUILDINGS[k].name+' ур.'+v).join(', ')}
function costOf(key,lvl){const b=BUILDINGS[key].base,c={};for(const r in b)c[r]=Math.floor(b[r]*Math.pow(1.55,lvl));return c}
function stageCost(key,lvl,idx){const total=costOf(key,lvl),part=STAGES[idx].part,out={};for(const r in total)out[r]=Math.max(1,Math.ceil(total[r]*part));return out}
function costText(c){return Object.entries(c).map(([r,v])=>`<span class="${(state.res[r]||0)>=v?'ok':'bad'}">${RES_META[r].icon} ${v}</span>`).join('')}
function getProduction(){const p={wood:0,stone:0,iron:0,food:0,gold:0};for(const k in BUILDINGS){const lvl=state.buildings[k]||0,pr=BUILDINGS[k].prod;if(!pr||lvl<=0)continue;for(const r in pr)p[r]+=pr[r]*lvl}return p}
function getEat(){let e=0;for(const k in UNITS)e+=(state.army[k]||0)*UNITS[k].eat;return e}
function getCap(){return 10+(state.buildings.house||0)*10}
function armySize(){let n=0;for(const k in state.army)n+=state.army[k];return n}

function gameTick(dt){const prod=getProduction();for(const r in prod)state.res[r]+=prod[r]*dt;const cap=getCap();if(state.res.people<cap)state.res.people=Math.min(cap,state.res.people+0.2*dt);const eat=getEat();state.res.food-=eat*dt;if(state.res.food<=0){state.res.food=0;if(eat>prod.food){starveTimer+=dt;if(starveTimer>=5){starveTimer=0;desert()}}}else starveTimer=0}
function desert(){if(battleView&&battleView.active)return;const types=Object.keys(UNITS).filter(k=>state.army[k]>0);if(!types.length)return;const k=types[Math.floor(Math.random()*types.length)];state.army[k]--;dirty=true;toast(`⚠️ ${UNITS[k].name} дезертировал!`)}

function setTab(id){if(battleView&&battleView.active){if(!confirm('Покинуть бой?'))return;cancelBattle()}if(buildView)buildView=null;activeTab=id;animate=true;renderTabs();renderContent()}

function startBuild(key){if(state.build[key]){enterBuildView(key);return}const b=BUILDINGS[key],lvl=state.buildings[key]||0;if(lvl>=b.max)return;if(!checkReq(b.req)){toast('Требования не выполнены');return}const cost=stageCost(key,lvl,0);if(!canPay(cost)){toast('Недостаточно ресурсов');return}pay(cost);state.build[key]={stage:0,done:[]};save();enterBuildView(key)}
function enterBuildView(key){buildView={key,waiting:false,advancing:false};renderTabs();renderContent()}
function exitBuildView(){buildView=null;animate=true;renderTabs();renderContent()}
function clickBuildPoint(idx){if(!buildView||buildView.advancing)return;const key=buildView.key,cons=state.build[key];if(!cons)return;if(cons.done.includes(idx))return;const total=STAGE_POINTS[cons.stage];if(idx<0||idx>=total)return;cons.done.push(idx);save();if(cons.done.length>=total){buildView.advancing=true;renderContent();setTimeout(()=>{if(buildView)buildView.advancing=false;advanceFor(key)},500)}else renderContent()}
function advanceFor(key){const cons=state.build[key];if(!cons)return;const lvl=state.buildings[key]||0;if(cons.stage>=STAGES.length-1){state.buildings[key]=lvl+1;delete state.build[key];save();toast(`🎉 ${BUILDINGS[key].name} — ур.${lvl+1}!`);if(buildView&&buildView.key===key){buildView=null;activeTab='build';renderTabs();renderContent()}else dirty=true;return}const ns=cons.stage+1,cost=stageCost(key,lvl,ns);if(!canPay(cost)){if(buildView&&buildView.key===key){buildView.waiting=true;renderContent()}return}pay(cost);cons.stage=ns;cons.done=[];save();toast(`Этап: ${STAGES[ns].name}`);if(buildView&&buildView.key===key){buildView.waiting=false;renderContent()}else dirty=true}

function trainUnit(key){const u=UNITS[key];if(!checkReq(u.req)){toast('Нужна казарма');return}if(!canPay(u.cost)){toast('Недостаточно ресурсов');return}for(const w in u.weapons){if((state.weapons[w]||0)<u.weapons[w]){toast('Не хватает: '+WEAPONS[w].name);return}}pay(u.cost);for(const w in u.weapons)state.weapons[w]-=u.weapons[w];state.army[key]++;dirty=true;renderContent();toast(`${u.icon} ${u.name} в строю!`)}
function craftWeapon(key){const w=WEAPONS[key];if(!checkReq(w.req)){toast('Нужна кузница');return}if(!canPay(w.cost)){toast('Недостаточно ресурсов');return}pay(w.cost);state.weapons[key]++;dirty=true;renderContent();toast(`${w.icon} ${w.name} выкован`)}
function buyRes(res,amount,price){if(state.res.gold<price){toast('Не хватает золота');return}state.res.gold-=price;state.res[res]+=amount;dirty=true;renderContent();toast(`Куплено: ${RES_META[res].icon} ${amount}`)}
function resetGame(){if(!confirm('Начать заново?'))return;localStorage.removeItem(SAVE_KEY);state=newState();starveTimer=0;buildView=null;battleView=null;if(battleRAF)cancelAnimationFrame(battleRAF);battleRAF=null;activeTab='build';animate=true;renderTabs();renderContent();toast('Новая империя основана')}

function startAttack(stateId){const st=STATES.find(s=>s.id===stateId);if(!st)return;if(armySize()===0){toast('Нет армии');return}beginBattle({type:'attack',stateId,name:st.name,reward:st.reward,layout:STATE_LAYOUTS[stateId]})}
function startDefend(){if(armySize()===0){toast('Нет армии');return}const power=Math.max(2,Math.floor(armySize()*0.7+2));const eArmy={inf:Math.max(1,Math.floor(power*0.6))};if(power>3)eArmy.arc=Math.floor(power*0.3);if(power>6)eArmy.kn=Math.floor(power*0.1);beginBattle({type:'defend',name:'Налётчики',reward:{gold:Math.floor(power*15),food:Math.floor(power*5)},enemyArmy:eArmy})}

function beginBattle(info){if(battleRAF)cancelAnimationFrame(battleRAF);battleRAF=null;const playerUnits=spawnPlayerUnits(state.army);let enemyUnits=[],structures=[];if(info.type==='attack'&&info.layout){const L=info.layout;if(L.gate)structures.push({type:'gate',x:L.gate.x,y:L.gate.y,w:L.gate.w,h:L.gate.h,hp:L.gate.hp,maxHp:L.gate.hp,alive:true,flash:0});for(const tw of(L.towers||[]))structures.push({type:'tower',x:tw.x,y:tw.y,w:tw.w,h:tw.h,hp:tw.hp,maxHp:tw.hp,alive:true,flash:0,range:tw.range,dmg:tw.dmg,atkSpeed:tw.atkSpeed,atkCd:Math.random()*0.5});for(const pos of L.enemies)enemyUnits.push(makeUnit(pos.type,'enemy',pos.x,pos.y))}else{enemyUnits=spawnEnemyUnits(info.enemyArmy)}battleView={type:info.type,stateId:info.stateId||null,enemyName:info.name,reward:info.reward,playerUnits,enemyUnits,structures,selected:[],dragStart:null,dragEnd:null,active:true,result:null};renderTabs();renderContent();setTimeout(startBattleLoop,60)}

function spawnPlayerUnits(a){const t=[];for(const k in a)for(let i=0;i<a[k];i++)t.push(k);for(let i=t.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[t[i],t[j]]=[t[j],t[i]]}const cols=Math.max(1,Math.min(6,Math.ceil(Math.sqrt(t.length||1))));const spX=300/(cols+1);return t.map((k,i)=>{const col=i%cols,row=Math.floor(i/cols);return makeUnit(k,'player',30+spX*(col+1),390+row*26+Math.random()*4)})}
function spawnEnemyUnits(a){const t=[];for(const k in a)for(let i=0;i<a[k];i++)t.push(k);const cols=Math.max(1,Math.min(6,Math.ceil(Math.sqrt(t.length||1))));const spX=300/(cols+1);return t.map((k,i)=>{const col=i%cols,row=Math.floor(i/cols);return makeUnit(k,'enemy',30+spX*(col+1),50+row*26+Math.random()*4)})}
function makeUnit(type,team,x,y){const s=COMBAT_STATS[type];return{type,team,x,y,hp:s.hp,maxHp:s.hp,dmg:s.dmg,speed:s.speed,range:s.range,radius:s.radius,atkSpeed:s.atkSpeed,atkCd:Math.random()*0.5,color:team==='player'?s.playerColor:s.enemyColor,target:null,order:null,flash:0}}

function startBattleLoop(){if(battleRAF)cancelAnimationFrame(battleRAF);let prev=performance.now();function loop(now){const dt=Math.min(0.05,(now-prev)/1000);prev=now;if(!battleView||!battleView.active){battleRAF=null;return}updateBattle(dt);drawBattle();if(checkBattleEnd()){battleRAF=null;return}battleRAF=requestAnimationFrame(loop)}battleRAF=requestAnimationFrame(loop)}
function checkBattleEnd(){const bv=battleView;if(!bv.active)return true;const aP=bv.playerUnits.filter(u=>u.hp>0).length;const aE=bv.enemyUnits.filter(u=>u.hp>0).length;const g=bv.structures.find(s=>s.type==='gate');const gA=g?g.alive:false;if(aP===0){endBattle(false);return true}if(bv.type==='attack'){if(aE===0&&!gA){endBattle(true);return true}}else{if(aE===0){endBattle(true);return true}}return false}
function isValidTarget(t){if(!t)return false;if(t.alive===false)return false;if(t.hp<=0)return false;return true}
function targetX(t){return t.radius!==undefined?t.x:t.x+t.w/2}
function targetY(t){return t.radius!==undefined?t.y:t.y+t.h/2}
function targetR(t){return t.radius!==undefined?t.radius:Math.max(t.w,t.h)/2}
function nearestTarget(u,list){let best=null,bd=Infinity;for(const e of list){if(!isValidTarget(e))continue;const d=Math.hypot(targetX(e)-u.x,targetY(e)-u.y);if(d<bd){bd=d;best=e}}return best}
function nearestInRange(x,y,r,list){let best=null,bd=Infinity;for(const e of list){if(!isValidTarget(e))continue;const d=Math.hypot(targetX(e)-x,targetY(e)-y);if(d<=r&&d<bd){bd=d;best=e}}return best}

function updateBattle(dt){const bv=battleView;const gate=bv.structures.find(s=>s.type==='gate');const gateAlive=gate&&gate.alive;for(const s of bv.structures){if(s.type!=='tower'||!s.alive)continue;s.atkCd-=dt;if(s.atkCd<=0){const tgt=nearestInRange(s.x+s.w/2,s.y+s.h/2,s.range,bv.playerUnits);if(tgt){tgt.hp-=s.dmg;tgt.flash=0.15;s.atkCd=s.atkSpeed}else s.atkCd=0.2}if(s.flash>0)s.flash-=dt}const all=[...bv.playerUnits,...bv.enemyUnits];for(const u of all){if(u.hp<=0)continue;if(u.flash>0)u.flash-=dt;if(u.team==='player'&&u.order){handleOrder(u,dt);continue}const foes=u.team==='player'?bv.enemyUnits:bv.playerUnits;let stationary=false;if(u.team==='enemy'&&gateAlive&&gate&&u.y<gate.y+gate.h)stationary=true;if(!isValidTarget(u.target)){u.target=null;if(u.team==='player'&&gateAlive&&gate&&u.y>gate.y+gate.h)u.target=gate;else{u.target=nearestTarget(u,foes);if(!u.target&&u.team==='player'&&gateAlive&&gate&&u.y>gate.y+gate.h)u.target=gate}}if(!u.target){if(stationary)continue;u.atkCd-=dt;continue}const tx=targetX(u.target),ty=targetY(u.target);const dx=tx-u.x,dy=ty-u.y;const dist=Math.hypot(dx,dy)||1;const tR=targetR(u.target);u.atkCd-=dt;if(dist<=u.range+tR){if(u.atkCd<=0){u.target.hp-=u.dmg;u.target.flash=0.15;if(u.target.type&&(u.target.type==='gate'||u.target.type==='tower')){if(u.target.hp<=0)u.target.alive=false}u.atkCd=u.atkSpeed}}else if(!stationary){moveUnit(u,(dx/dist)*u.speed*dt,(dy/dist)*u.speed*dt)}}}
function handleOrder(u,dt){const bv=battleView,o=u.order;if(o.type==='hold'){if(!isValidTarget(u.target)){const foes=[...bv.enemyUnits,...bv.structures.filter(s=>s.alive)];u.target=nearestInRange(u.x,u.y,u.range,foes)}if(isValidTarget(u.target)){const d=Math.hypot(targetX(u.target)-u.x,targetY(u.target)-u.y);if(d<=u.range+targetR(u.target)){u.atkCd-=dt;if(u.atkCd<=0){u.target.hp-=u.dmg;u.target.flash=0.15;if((u.target.type==='gate'||u.target.type==='tower')&&u.target.hp<=0)u.target.alive=false;u.atkCd=u.atkSpeed}}}return}if(o.type==='move'){const dx=o.x-u.x,dy=o.y-u.y;const d=Math.hypot(dx,dy);if(d<6){u.order=null;return}moveUnit(u,(dx/d)*u.speed*dt,(dy/d)*u.speed*dt);return}if(o.type==='attack'){if(!isValidTarget(o.target)){u.order=null;u.target=null;return}const tx=targetX(o.target),ty=targetY(o.target);const dx=tx-u.x,dy=ty-u.y;const d=Math.hypot(dx,dy)||1;const tR=targetR(o.target);u.atkCd-=dt;if(d<=u.range+tR){if(u.atkCd<=0){o.target.hp-=u.dmg;o.target.flash=0.15;if((o.target.type==='gate'||o.target.type==='tower')&&o.target.hp<=0)o.target.alive=false;u.atkCd=u.atkSpeed}}else{moveUnit(u,(dx/d)*u.speed*dt,(dy/d)*u.speed*dt)}return}}
function moveUnit(u,dx,dy){const bv=battleView;let nx=u.x+dx,ny=u.y+dy;const gate=bv.structures.find(s=>s.type==='gate'&&s.alive);if(gate){const gTop=gate.y,gBot=gate.y+gate.h,uR=u.radius;if(u.y>=gBot-1&&ny<gBot+uR)ny=gBot+uR;if(u.y<=gTop+1&&ny>gTop-uR)ny=gTop-uR}nx=Math.max(u.radius+2,Math.min(358-u.radius,nx));ny=Math.max(u.radius+2,Math.min(458-u.radius,ny));u.x=nx;u.y=ny}

function drawBattle(){const cv=document.getElementById('battleCanvas');if(!cv)return;const ctx=cv.getContext('2d');const W=cv.width,H=cv.height;const bv=battleView;ctx.fillStyle='#0f172a';ctx.fillRect(0,0,W,H);const gate=bv.structures.find(s=>s.type==='gate');if(gate){ctx.fillStyle='rgba(239,68,68,0.06)';ctx.fillRect(0,0,W,gate.y+gate.h)}ctx.strokeStyle='rgba(148,163,184,0.06)';ctx.lineWidth=1;for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(const s of bv.structures){if(s.type==='gate')drawGate(ctx,s);else if(s.type==='tower')drawTower(ctx,s)}for(const u of bv.enemyUnits)if(u.hp>0)drawUnit(ctx,u);for(const u of bv.playerUnits)if(u.hp>0)drawUnit(ctx,u);for(const u of bv.selected){if(u.hp<=0)continue;ctx.strokeStyle='#fbbf24';ctx.lineWidth=2;ctx.beginPath();ctx.arc(u.x,u.y,u.radius+4,0,Math.PI*2);ctx.stroke()}if(bv.dragStart&&bv.dragEnd){const p1=bv.dragStart,p2=bv.dragEnd;const x=Math.min(p1.x,p2.x),y=Math.min(p1.y,p2.y);const w=Math.abs(p2.x-p1.x),h=Math.abs(p2.y-p1.y);if(w>5||h>5){ctx.strokeStyle='#3b82f6';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);ctx.strokeRect(x,y,w,h);ctx.fillStyle='rgba(59,130,246,0.12)';ctx.fillRect(x,y,w,h);ctx.setLineDash([])}}}
function drawUnit(ctx,u){ctx.fillStyle=u.flash>0?'#ffffff':u.color;ctx.beginPath();ctx.arc(u.x,u.y,u.radius,0,Math.PI*2);ctx.fill();const pct=Math.max(0,u.hp/u.maxHp);const bw=u.radius*2+6;ctx.fillStyle='rgba(15,23,42,0.85)';ctx.fillRect(u.x-bw/2,u.y-u.radius-9,bw,4);ctx.fillStyle=pct>0.5?'#22c55e':pct>0.25?'#eab308':'#ef4444';ctx.fillRect(u.x-bw/2,u.y-u.radius-9,bw*pct,4)}
function drawHPBar(ctx,x,y,w,h,pct){pct=Math.max(0,Math.min(1,pct));ctx.fillStyle='rgba(15,23,42,0.9)';ctx.fillRect(x,y,w,h);ctx.fillStyle=pct>0.5?'#22c55e':pct>0.25?'#eab308':'#ef4444';ctx.fillRect(x,y,w*pct,h)}
function drawGate(ctx,s){if(!s.alive){ctx.fillStyle='rgba(100,100,100,0.25)';ctx.fillRect(s.x,s.y+s.h-4,s.w,4);return}ctx.fillStyle='#3e2204';ctx.fillRect(s.x,s.y,s.w,s.h);ctx.strokeStyle='#5c2e0e';ctx.lineWidth=2;ctx.strokeRect(s.x,s.y,s.w,s.h);ctx.strokeStyle='#5c2e0e';ctx.lineWidth=1;const n=Math.floor(s.w/10);for(let i=1;i<n;i++){const px=s.x+(s.w/n)*i;ctx.beginPath();ctx.moveTo(px,s.y+2);ctx.lineTo(px,s.y+s.h-2);ctx.stroke()}ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(s.x+s.w/2-25,s.y+2,50,s.h-4);ctx.strokeStyle='#b45309';ctx.lineWidth=1.5;ctx.strokeRect(s.x+s.w/2-25,s.y+2,50,s.h-4);drawHPBar(ctx,s.x,s.y-8,s.w,5,s.hp/s.maxHp)}
function drawTower(ctx,s){if(!s.alive){ctx.fillStyle='rgba(100,100,100,0.3)';ctx.fillRect(s.x,s.y+s.h-6,s.w,6);return}ctx.fillStyle='#475569';ctx.fillRect(s.x,s.y+10,s.w,s.h-10);ctx.strokeStyle='#1e293b';ctx.lineWidth=1.5;ctx.strokeRect(s.x,s.y+10,s.w,s.h-10);ctx.fillStyle='#334155';const cW=s.w/4;for(let i=0;i<4;i+=2)ctx.fillRect(s.x+i*cW,s.y,cW,10);ctx.fillStyle='#ef4444';for(let i=0;i<2;i++){ctx.beginPath();ctx.arc(s.x+s.w*(0.3+i*0.4),s.y+5,3,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#0f172a';ctx.fillRect(s.x+s.w/2-3,s.y+s.h/2-3,6,8);drawHPBar(ctx,s.x,s.y-8,s.w,5,s.hp/s.maxHp);if(s.flash>0){ctx.strokeStyle='rgba(239,68,68,'+Math.min(1,s.flash*5)+')';ctx.lineWidth=3;ctx.strokeRect(s.x-2,s.y-2,s.w+4,s.h+4)}}

function canvasPos(e){const cv=document.getElementById('battleCanvas');const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}

function findEnemyAt(x,y){let best=null,bd=Infinity;for(const u of battleView.enemyUnits){if(u.hp<=0)continue;const d=Math.hypot(u.x-x,u.y-y);if(d<u.radius+14&&d<bd){bd=d;best=u}}return best}
function findStructureAt(x,y){for(const s of battleView.structures){if(!s.alive)continue;if(x>=s.x-8&&x<=s.x+s.w+8&&y>=s.y-8&&y<=s.y+s.h+8)return s}return null}
function onCanvasDown(e){e.preventDefault();if(!battleView||!battleView.active)return;const p=canvasPos(e);const myUnit=findPlayerAt(p.x,p.y);if(myUnit){const i=battleView.selected.indexOf(myUnit);if(i>=0)battleView.selected.splice(i,1);else battleView.selected.push(myUnit);drawBattle();renderBattleCommands();return}if(battleView.selected.length>0){const foe=findEnemyAt(p.x,p.y);if(foe){for(const u of battleView.selected)u.order={type:'attack',target:foe};toast('⚔️ Атака');drawBattle();return}const st=findStructureAt(p.x,p.y);if(st){for(const u of battleView.selected)u.order={type:'attack',target:st};toast('⚔️ Атака');drawBattle();return}for(const u of battleView.selected)u.order={type:'move',x:p.x,y:p.y};toast('🚶 Движение');drawBattle();return}battleView.dragStart=p;battleView.dragEnd=p}
function onCanvasMove(e){if(!battleView||!battleView.dragStart)return;e.preventDefault();battleView.dragEnd=canvasPos(e);drawBattle()}
function onCanvasUp(e){if(!battleView||!battleView.dragStart)return;e.preventDefault();const p1=battleView.dragStart,p2=battleView.dragEnd;const minX=Math.min(p1.x,p2.x),maxX=Math.max(p1.x,p2.x),minY=Math.min(p1.y,p2.y),maxY=Math.max(p1.y,p2.y);if((maxX-minX)>10||(maxY-minY)>10){for(const u of battleView.playerUnits){if(u.hp<=0)continue;if(u.x>=minX&&u.x<=maxX&&u.y>=minY&&u.y<=maxY){if(!battleView.selected.includes(u))battleView.selected.push(u)}}}battleView.dragStart=null;battleView.dragEnd=null;drawBattle();renderBattleCommands()}
function cmdHold(){for(const u of battleView.selected){u.order={type:'hold'};u.target=null}toast('🛑 Стоять')}
function cmdAuto(){for(const u of battleView.selected){u.order=null;u.target=null}toast('🎯 Авто')}
function cmdRetreat(){const sel=battleView.selected.slice();let n=0;for(const u of sel){u.hp=0;u.retreated=true;n++}battleView.selected=[];toast(`🏃 ${n} отступили`);drawBattle();renderBattleCommands();checkBattleEnd()}
function cmdClear(){battleView.selected=[];drawBattle();renderBattleCommands()}

function endBattle(win){const bv=battleView;if(!bv.active)return;bv.active=false;const surv={};for(const u of bv.playerUnits){if(u.hp>0||u.retreated)surv[u.type]=(surv[u.type]||0)+1}state.army={};for(const t in UNITS)state.army[t]=surv[t]||0;let detail='';if(win){const r=bv.reward||{};for(const k in r)state.res[k]=(state.res[k]||0)+r[k];detail='Награда: '+Object.entries(r).map(([k,v])=>`${RES_META[k].icon} ${v}`).join(' · ');if(bv.type==='attack'&&bv.stateId&&!state.conquered.includes(bv.stateId))state.conquered.push(bv.stateId);if(bv.type==='defend')state.defendWins++}else{if(bv.type==='defend'){const g=Math.min(state.res.gold,80),f=Math.min(state.res.food,40);state.res.gold-=g;state.res.food-=f;detail=`Враг разграбил: 💰${g} · 🌾${f}`}else detail='Армия разбита'}bv.result={win,detail};save();setTimeout(()=>{if(battleView===bv)renderContent()},400);
// Telegram: отправить счёт
const tg=window.Telegram?.WebApp;if(tg&&win&&bv.type==='attack'){tg.sendData(JSON.stringify({type:'conquer',state:bv.enemyName,army:Object.values(state.army).reduce((a,b)=>a+b,0)}))}}
function cancelBattle(){if(battleRAF)cancelAnimationFrame(battleRAF);battleRAF=null;if(battleView&&battleView.active){const s={};for(const u of battleView.playerUnits){if(u.hp>0||u.retreated)s[u.type]=(s[u.type]||0)+1}state.army={};for(const t in UNITS)state.army[t]=s[t]||0;save()}battleView=null;activeTab='world';animate=true;renderTabs();renderContent()}
function finishBattle(){if(battleRAF)cancelAnimationFrame(battleRAF);battleRAF=null;battleView=null;activeTab='world';animate=true;renderTabs();renderContent()}

// ===== UI =====
function initResBar(){const items=[['wood','🪵'],['stone','🪨'],['iron','⛓️'],['food','🌾'],['gold','💰']];let h='';items.forEach(([k,ic])=>{h+=`<div class="chip"><span>${ic}</span><b id="v-${k}">0</b>`;if(k==='food')h+=`<span class="rate" id="r-food">+0.0/с</span>`;h+=`</div>`});h+=`<div class="chip"><span>👥</span><b id="v-people">0</b> <span class="cap" id="c-people">/10</span></div>`;document.getElementById('resBar').innerHTML=h}
function setTxt(id,v){const el=document.getElementById(id);if(el&&el.textContent!==v)el.textContent=v}
function updateResBar(){const p=getProduction();const bal=p.food-getEat();setTxt('v-wood',fmt(state.res.wood));setTxt('v-stone',fmt(state.res.stone));setTxt('v-iron',fmt(state.res.iron));setTxt('v-food',fmt(state.res.food));setTxt('v-gold',fmt(state.res.gold));setTxt('v-people',fmt(state.res.people));setTxt('c-people','/'+getCap());const r=document.getElementById('r-food');if(r){const t=fmtRate(bal)+'/с';if(r.textContent!==t)r.textContent=t;const cls='rate '+(bal>=0?'pos':'neg');if(r.className!==cls)r.className=cls}}
function renderTabs(){const eff=battleView?'world':buildView?'build':activeTab;document.getElementById('tabs').innerHTML=TABS.map(t=>`<button class="tab ${t.id===eff?'active':''}" onclick="setTab('${t.id}')">${t.name}</button>`).join('')}
function renderContent(){let h='';if(battleView)h=renderBattle();else if(buildView)h=renderBuildView();else{switch(activeTab){case'build':h=renderBuild();break;case'army':h=renderArmy();break;case'forge':h=renderForge();break;case'world':h=renderWorld();break;case'market':h=renderMarket();break;case'info':h=renderInfo();break}}document.getElementById('content').innerHTML=h;animate=false;updateAffordability();if(battleView){attachCanvasEvents();renderBattleCommands()}}
function attachCanvasEvents(){const cv=document.getElementById('battleCanvas');if(!cv)return;cv.style.touchAction='none';cv.onpointerdown=onCanvasDown;cv.onpointermove=onCanvasMove;cv.onpointerup=onCanvasUp;cv.onpointercancel=onCanvasUp}
function cardCls(extra){return'card'+(animate?' anim':'')+(extra?' '+extra:'')}

function renderBuild(){let h='<div class="section-title">Постройки</div><div class="grid">';for(const key in BUILDINGS)h+=buildCard(key);return h+'</div>'}
function prodLine(key,lvl){const b=BUILDINGS[key];if(b.prod){if(lvl>0)return'<div class="prod">'+Object.entries(b.prod).map(([r,v])=>`${RES_META[r].icon} +${(v*lvl).toFixed(1)}/с`).join(' · ')+'</div>';return'<div class="prod dim">'+Object.entries(b.prod).map(([r,v])=>`${RES_META[r].icon} +${v.toFixed(1)}/с на ур.1`).join(' · ')+'</div>'}if(key==='house'&&lvl>0)return`<div class="prod">👥 +${lvl*10}</div>`;return''}
function buildCard(key){const b=BUILDINGS[key],lvl=state.buildings[key]||0;if(!checkReq(b.req))return`<div class="${cardCls('locked')}"><div class="card-head"><span class="icon">${b.icon}</span><span class="title">${b.name}</span><span class="lvl">🔒</span></div><div class="desc">${b.desc}</div><div class="req">Нужно: ${reqText(b.req)}</div></div>`;const cons=state.build[key];let inner=`<div class="card-head"><span class="icon">${b.icon}</span><span class="title">${b.name}</span><span class="lvl">Ур.${lvl}</span></div><div class="desc">${b.desc}</div>${prodLine(key,lvl)}`;if(!cons&&lvl>=b.max){inner+='<div class="maxed">Максимум</div>';return`<div class="${cardCls()}">${inner}</div>`}if(cons){const st=STAGES[cons.stage];inner+=`<div class="stage-name">Этап ${cons.stage+1}/6: ${st.name}</div><div class="stage-name">${cons.done.length}/${STAGE_POINTS[cons.stage]}</div><button class="btn green" onclick="startBuild('${key}')">🔨 Продолжить</button>`}else inner+=`<button class="btn" onclick="startBuild('${key}')">🏗️ Начать</button>`;return`<div class="${cardCls()}">${inner}</div>`}

function renderBuildView(){const key=buildView.key,b=BUILDINGS[key],cons=state.build[key];if(!cons){buildView=null;return renderBuild()}const stage=cons.stage,st=STAGES[stage],total=STAGE_POINTS[stage];const doneCount=cons.done.length,doneAll=doneCount>=total;const nextLvl=(state.buildings[key]||0)+1;let h=`<div class="build-header"><button class="back-btn" onclick="exitBuildView()">← Назад</button><div class="build-title">${b.icon} ${b.name}</div><div class="build-level">→ ур.${nextLvl}</div></div><div class="stage-info"><div class="stage-name-big">${st.icon} ${st.name}</div><div class="stage-hint">${STAGE_HINTS[stage]}</div><div class="stage-progress">${doneCount}/${total}</div></div><div class="build-svg-wrap ${doneAll?'complete':''}">${renderStageSVG(stage,cons.done,key)}</div>`;if(doneAll&&!buildView.advancing)h+='<div class="stage-done-msg">✓ Этап завершён!</div>';if(buildView.waiting){const ns=stage+1;const c=stageCost(key,state.buildings[key]||0,ns);h+=`<div class="waiting-msg">⏳ Ждём ресурсы для «${STAGES[ns].name}»</div><div class="cost" style="justify-content:center;margin-top:8px">${costText(c)}</div>`}return h}

function getShapeConfig(key){const type=BUILDING_SHAPES[key]||'stone';const foundation={x:20,y:245,w:260,h:35};const colXs=[35,100,165,230];const colY=140,colH=105,colW=18;const rods=[];for(let i=0;i<6;i++)rods.push({x:45+i*42,y:245,h:35});const concrete=[];for(let i=0;i<4;i++)concrete.push({x:25+i*65,y:248,w:60,h:29});const columnRods=colXs.map(x=>({x:x+colW/2,y:colY,h:colH}));const columnConcrete=colXs.map(x=>({x,y:colY,w:colW,h:colH}));const walls=[];const secs=[{x:53,w:47},{x:118,w:47},{x:183,w:47}];const rows=[{y:150,h:42},{y:197,h:42}];for(const r of rows)for(const s of secs)walls.push({x:s.x,y:r.y,w:s.w,h:r.h});let roof,colors;if(type==='house'){roof=[{x:20,y:100,w:85,h:40},{x:108,y:100,w:84,h:40},{x:195,y:100,w:85,h:40},{x:62,y:68,w:83,h:32},{x:155,y:68,w:83,h:32},{x:110,y:42,w:80,h:26}];colors={wall:'#a16207',wallEdge:'#ca8a04',roof:'#b91c1c',roofEdge:'#ef4444'}}else if(type==='wooden'){roof=[{x:20,y:105,w:90,h:35},{x:110,y:105,w:90,h:35},{x:200,y:105,w:80,h:35},{x:40,y:75,w:110,h:30},{x:150,y:75,w:110,h:30},{x:80,y:50,w:140,h:25}];colors={wall:'#92400e',wallEdge:'#b45309',roof:'#78350f',roofEdge:'#a16207'}}else{roof=[{x:20,y:100,w:85,h:40},{x:108,y:100,w:84,h:40},{x:195,y:100,w:85,h:40},{x:20,y:72,w:85,h:28},{x:108,y:72,w:84,h:28},{x:195,y:72,w:85,h:28}];colors={wall:'#475569',wallEdge:'#64748b',roof:'#334155',roofEdge:'#475569'}}return{type,foundation,colXs,colY,colW,colH,rods,concrete,columnRods,columnConcrete,walls,roof,colors}}

function renderStageSVG(stage,done,key){const d=i=>done.includes(i);const cfg=getShapeConfig(key);const{foundation,colXs,colY,colW,colH,rods,concrete,columnRods,columnConcrete,walls,roof,colors}=cfg;let s=`<rect x="0" y="0" width="300" height="300" fill="#0b0f15"/>`;s+=`<line x1="10" y1="288" x2="290" y2="288" stroke="#1e293b" stroke-width="2"/>`;switch(stage){case 0:s+=`<rect x="${foundation.x}" y="${foundation.y}" width="${foundation.w}" height="${foundation.h}" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3"/>`;rods.forEach((r,i)=>{const on=d(i);s+=`<rect x="${r.x-2}" y="${r.y}" width="4" height="${r.h}" fill="${on?'#f59e0b':'#1e293b'}" stroke="${on?'#fbbf24':'#475569'}" stroke-width="1"/>`;if(!on)s+=`<rect x="${r.x-15}" y="${r.y-5}" width="30" height="${r.h+10}" fill="transparent" pointer-events="all" style="cursor:pointer" onclick="clickBuildPoint(${i})"/>`});break;case 1:s+=`<rect x="${foundation.x}" y="${foundation.y}" width="${foundation.w}" height="${foundation.h}" fill="none" stroke="#334155" stroke-width="1.5"/>`;concrete.forEach((c,i)=>{const on=d(i);s+=`<rect x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" fill="${on?'#94a3b8':'transparent'}" stroke="${on?'#cbd5e1':'#475569'}" stroke-width="1" ${on?'':'style="cursor:pointer" onclick="clickBuildPoint('+i+')"'}/>`});break;case 2:s+=`<rect x="${foundation.x}" y="${foundation.y}" width="${foundation.w}" height="${foundation.h}" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1"/>`;columnRods.forEach((r,i)=>{const on=d(i);s+=`<rect x="${colXs[i]}" y="${colY}" width="${colW}" height="${colH}" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>`;s+=`<rect x="${r.x-2}" y="${r.y+5}" width="4" height="${r.h-10}" fill="${on?'#f59e0b':'#1e293b'}" stroke="${on?'#fbbf24':'#475569'}" stroke-width="1"/>`;if(!on)s+=`<rect x="${colXs[i]-3}" y="${colY}" width="${colW+6}" height="${colH}" fill="transparent" pointer-events="all" style="cursor:pointer" onclick="clickBuildPoint(${i})"/>`});break;case 3:s+=`<rect x="${foundation.x}" y="${foundation.y}" width="${foundation.w}" height="${foundation.h}" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1"/>`;columnConcrete.forEach((c,i)=>{const on=d(i);s+=`<rect x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" fill="${on?'#94a3b8':'transparent'}" stroke="${on?'#cbd5e1':'#475569'}" stroke-width="1" ${on?'':'style="cursor:pointer" onclick="clickBuildPoint('+i+')"'}/>`});break;case 4:s+=`<rect x="${foundation.x}" y="${foundation.y}" width="${foundation.w}" height="${foundation.h}" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1"/>`;for(const x of colXs)s+=`<rect x="${x}" y="${colY}" width="${colW}" height="${colH}" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1"/>`;walls.forEach((w,i)=>{const on=d(i);s+=`<rect x="${w.x}" y="${w.y}" width="${w.w}" height="${w.h}" fill="${on?colors.wall:'transparent'}" stroke="${on?colors.wallEdge:'#475569'}" stroke-width="1" ${on?'':'style="cursor:pointer" onclick="clickBuildPoint('+i+')"'}/>`});break;case 5:s+=`<rect x="${foundation.x}" y="${foundation.y}" width="${foundation.w}" height="${foundation.h}" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1"/>`;for(const x of colXs)s+=`<rect x="${x}" y="${colY}" width="${colW}" height="${colH}" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1"/>`;for(const w of walls)s+=`<rect x="${w.x}" y="${w.y}" width="${w.w}" height="${w.h}" fill="${colors.wall}" stroke="${colors.wallEdge}" stroke-width="1"/>`;roof.forEach((t,i)=>{const on=d(i);s+=`<rect x="${t.x}" y="${t.y}" width="${t.w}" height="${t.h}" fill="${on?colors.roof:'transparent'}" stroke="${on?colors.roofEdge:'#475569'}" stroke-width="1.5" ${on?'':'style="cursor:pointer" onclick="clickBuildPoint('+i+')"'}/>`});break}return`<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">${s}</svg>`}

function renderArmy(){const eat=getEat(),bal=getProduction().food-eat;let h=`<div class="section-title">Армия: ${armySize()} · еда <span style="color:${bal>=0?'#4ade80':'#f87171'}">${fmtRate(bal)}/с</span></div><div class="grid">`;for(const key in UNITS){const u=UNITS[key];if(!checkReq(u.req)){h+=`<div class="${cardCls('locked')}"><div class="card-head"><span class="icon">${u.icon}</span><span class="title">${u.name}</span><span class="lvl">🔒</span></div><div class="desc">${u.desc}</div><div class="req">Нужно: ${reqText(u.req)}</div></div>`;continue}const wpn=Object.entries(u.weapons).map(([w,n])=>{const have=state.weapons[w]||0;return`<span class="${have>=n?'ok':'bad'}">${WEAPONS[w].icon} ${n}/${Math.floor(have)}</span>`}).join('');h+=`<div class="${cardCls()}"><div class="card-head"><span class="icon">${u.icon}</span><span class="title">${u.name}</span><span class="lvl">${state.army[key]}</span></div><div class="desc">${u.desc} · 🍖 ${u.eat}/с</div><div class="cost">${costText(u.cost)}</div><div class="weap">${wpn}</div><button class="btn green" data-cost='${JSON.stringify({res:u.cost,wep:u.weapons})}' onclick="trainUnit('${key}')">Обучить</button></div>`}return h+'</div>'}
function renderForge(){let h='<div class="section-title">Кузница</div><div class="grid">';for(const key in WEAPONS){const w=WEAPONS[key];if(!checkReq(w.req)){h+=`<div class="${cardCls('locked')}"><div class="card-head"><span class="icon">${w.icon}</span><span class="title">${w.name}</span><span class="lvl">🔒</span></div><div class="req">Нужно: ${reqText(w.req)}</div></div>`;continue}h+=`<div class="${cardCls()}"><div class="card-head"><span class="icon">${w.icon}</span><span class="title">${w.name}</span><span class="lvl">${state.weapons[key]||0}</span></div><div class="desc">Оружие для армии</div><div class="cost">${costText(w.cost)}</div><button class="btn" data-cost='${JSON.stringify({res:w.cost})}' onclick="craftWeapon('${key}')">Выковать</button></div>`}return h+'</div>'}
function renderWorld(){let h='<div class="section-title">Завоевание</div><div class="grid">';STATES.forEach((st,i)=>{const def=state.conquered.includes(st.id);const unl=i===0||state.conquered.includes(STATES[i-1].id);const rdy=armySize()>=st.minArmy;const cls=def?'conquered':!unl?'locked':'';const L=STATE_LAYOUTS[st.id];const eCnt=L?L.enemies.length:0;const tCnt=L?(L.towers||[]).length:0;h+=`<div class="${cardCls(cls)}"><div class="card-head"><span class="icon">${st.icon}</span><span class="title">${st.name}</span>${def?'<span class="lvl">✅</span>':!unl?'<span class="lvl">🔒</span>':''}</div><div class="desc">${st.desc}</div><div class="cost"><span>⚔️ ${eCnt}</span><span>🏰 ${tCnt}</span></div><div class="cost"><span>🛡️ Мин: ${st.minArmy}</span></div>${def?'<div class="maxed">Завоёвано</div>':!unl?'<div class="req">Победи предыдущего</div>':`<button class="btn ${rdy?'green':''}" onclick="startAttack('${st.id}')">${rdy?'⚔️ Атаковать':'⚠️ Мало войск'}</button>`}</div>`});h+='</div><div class="section-title" style="margin-top:16px">Оборона</div><div class="grid">';h+=`<div class="${cardCls()}"><div class="card-head"><span class="icon">🛡️</span><span class="title">Отбить налёт</span><span class="lvl">${state.defendWins}</span></div><div class="desc">Враг пропорционален армии.</div><button class="btn" onclick="startDefend()">🛡️ Защищаться</button></div></div>`;return h}

function renderBattle(){const bv=battleView;if(!bv)return'';const aP=bv.playerUnits.filter(u=>u.hp>0).length;const aE=bv.enemyUnits.filter(u=>u.hp>0).length;const gate=bv.structures.find(s=>s.type==='gate');const tA=bv.structures.filter(s=>s.type==='tower'&&s.alive).length;const gA=gate&&gate.alive;let h=`<div class="battle-header"><button class="back-btn" onclick="exitBattleConfirm()">← Отступить</button><div class="build-title">⚔️ ${bv.enemyName||'Бой'}</div></div><div class="battle-stats"><div class="side player"><div class="side-label">Вы</div><div class="side-count">${aP}</div></div><div class="vs">VS</div><div class="side enemy"><div class="side-label">Враг</div><div class="side-count">${aE}</div></div></div>`;if(gA||tA>0)h+=`<div style="display:flex;gap:6px;justify-content:center;margin-bottom:8px;flex-wrap:wrap">${gA?`<span class="build-badge">🚪 ${Math.ceil(gate.hp)}/${gate.maxHp}</span>`:''}${tA>0?`<span class="build-badge">🏰 ${tA}</span>`:''}</div>`;h+=`<canvas id="battleCanvas" width="360" height="460" class="battle-canvas"></canvas><div id="battleCmdArea"></div><div class="battle-hint">Тап — выделить/приказ. Протяни рамку — выделение группы.</div>`;if(bv.result)h+=`<div class="battle-result ${bv.result.win?'win':'lose'}">${bv.result.win?'🏆 Победа!':'💀 Поражение'}<div class="battle-result-detail">${bv.result.detail||''}</div><button class="btn ${bv.result.win?'green':''}" onclick="finishBattle()">Продолжить</button></div>`;return h}
function renderBattleCommands(){const el=document.getElementById('battleCmdArea');if(!el||!battleView)return;const bv=battleView;if(!bv.active||bv.result){el.innerHTML='';return}const n=bv.selected.length;if(n===0){el.innerHTML='';return}el.innerHTML=`<div class="battle-commands"><div class="cmd-info">Выделено: ${n}</div><div class="cmd-grid"><button class="btn" onclick="cmdHold()">🛑 Стоять</button><button class="btn green" onclick="cmdAuto()">🎯 Авто</button><button class="btn red" onclick="cmdRetreat()">🏃 Отступить</button><button class="btn" onclick="cmdClear()">✖️ Снять</button></div></div>`}
function exitBattleConfirm(){if(!battleView)return;if(battleView.active&&!confirm('Отступить?'))return;cancelBattle()}

function renderMarket(){let h='<div class="section-title">Рынок</div><div class="grid">';SHOP.forEach(s=>{h+=`<div class="${cardCls()}"><div class="card-head"><span class="icon">${s.icon}</span><span class="title">${RES_META[s.res].name} +${s.amount}</span></div><div class="cost"><span class="${state.res.gold>=s.price?'ok':'bad'}">💰 ${s.price}</span></div><button class="btn" data-cost='${JSON.stringify({res:{gold:s.price}})}' onclick="buyRes('${s.res}',${s.amount},${s.price})">Купить</button></div>`});return h+'</div>'}
function renderInfo(){const p=getProduction(),eat=getEat(),bal=p.food-eat;let h='<div class="rows">';h+=`<div class="row"><span>👥 Население</span><span>${fmt(state.res.people)}/${getCap()}</span></div>`;h+=`<div class="row"><span>⚔️ Бойцов</span><span>${armySize()}</span></div>`;h+=`<div class="row"><span>⚖️ Еда</span><span style="color:${bal>=0?'#4ade80':'#f87171'}">${fmtRate(bal)}/с</span></div>`;h+='</div><div class="section-title" style="margin-top:16px">Армия</div><div class="rows">';let any=false;for(const k in UNITS)if(state.army[k]>0){any=true;h+=`<div class="row"><span>${UNITS[k].icon} ${UNITS[k].name}</span><span>${state.army[k]}</span></div>`}if(!any)h+='<div class="row"><span>Пусто</span><span>—</span></div>';h+='</div><div class="section-title" style="margin-top:16px">Завоевания</div><div class="rows">';h+=`<div class="row"><span>🌍 Покорено</span><span>${state.conquered.length}/${STATES.length}</span></div>`;h+=`<div class="row"><span>🛡️ Налётов отбито</span><span>${state.defendWins}</span></div></div>`;h+='<div style="margin-top:16px"><button class="btn red" onclick="resetGame()">🔄 Заново</button></div>';return h}

function updateAffordability(){const list=document.querySelectorAll('button[data-cost]');for(let i=0;i<list.length;i++){const b=list[i];let need;try{need=JSON.parse(b.dataset.cost)}catch(e){continue}let ok=true;const res=need.res||{};for(const r in res)if((state.res[r]||0)<res[r]){ok=false;break}if(ok&&need.wep)for(const w in need.wep)if((state.weapons[w]||0)<need.wep[w]){ok=false;break}if(b.disabled===ok)b.disabled=!ok}}
let toastTimer=null;function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}

function tick(){const now=performance.now();const dt=Math.min(0.5,(now-lastT)/1000);lastT=now;gameTick(dt);if(!buildView&&!battleView){for(const key in state.build){const cons=state.build[key];if(cons.done&&cons.done.length>=STAGE_POINTS[cons.stage]){advanceFor(key);break}}}if(battleView&&battleView.active){updateResBar();return}if(dirty){renderContent();dirty=false}updateResBar();updateAffordability()}

// ===== TELEGRAM =====
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();const origSave=save;save=function(){origSave();if(Math.random()<0.02){const totalArmy=Object.values(state.army).reduce((a,b)=>a+b,0);tg.sendData(JSON.stringify({type:'progress',army:totalArmy,conquered:state.conquered.length,gold:Math.floor(state.res.gold)}))}}}

initResBar();renderTabs();renderContent();updateResBar();setInterval(tick,200);setInterval(save,3000);
</script>
</body>
</html>
