<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flappy Bird</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(to bottom, #4ec0ca 0%, #87ceeb 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }
        #gameCanvas {
            border: 3px solid #fff;
            border-radius: 10px;
            background: linear-gradient(to bottom, #4ec0ca 0%, #87ceeb 70%, #ded895 100%);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 100%;
        }
        #score {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 10;
        }
        #overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 20;
        }
        #overlay h1 { font-size: 36px; margin-bottom: 20px; }
        #overlay p { font-size: 24px; margin-bottom: 30px; }
        #overlay button {
            padding: 15px 40px;
            font-size: 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        #overlay button:active { background: #45a049; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="score">0</div>
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    
    <div id="overlay">
        <h1>🐦 Flappy Bird</h1>
        <p>Тапни чтобы начать</p>
        <button id="startBtn">ИГРАТЬ</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('startBtn');
        
        // Telegram WebApp
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }
        
        // Игровые переменные
        let bird, pipes, score, gameRunning, gameOver, frame;
        const GRAVITY = 0.5;
        const JUMP = -8;
        const PIPE_SPEED = 3;
        const PIPE_GAP = 150;
        const PIPE_WIDTH = 60;
        const PIPE_INTERVAL = 90;
        
        function init() {
            bird = { x: 80, y: canvas.height / 2, vy: 0, radius: 15 };
            pipes = [];
            score = 0;
            frame = 0;
            gameRunning = true;
            gameOver = false;
            scoreEl.textContent = '0';
            overlay.classList.add('hidden');
        }
        
        function jump() {
            if (!gameRunning) return;
            bird.vy = JUMP;
            if (tg) tg.HapticFeedback.impactOccurred('light');
        }
        
        function addPipe() {
            const gapY = Math.random() * (canvas.height - PIPE_GAP - 100) + 50;
            pipes.push({ x: canvas.width, gapY: gapY, passed: false });
        }
        
        function update() {
            if (!gameRunning) return;
            
            frame++;
            
            // Физика птицы
            bird.vy += GRAVITY;
            bird.y += bird.vy;
            
            // Добавление труб
            if (frame % PIPE_INTERVAL === 0) addPipe();
            
            // Движение труб
            for (let pipe of pipes) {
                pipe.x -= PIPE_SPEED;
                
                // Подсчёт очков
                if (!pipe.passed && pipe.x + PIPE_WIDTH < bird.x) {
                    pipe.passed = true;
                    score++;
                    scoreEl.textContent = score;
                    if (tg) tg.HapticFeedback.notificationOccurred('success');
                }
            }
            
            // Удаление труб за экраном
            pipes = pipes.filter(p => p.x + PIPE_WIDTH > 0);
            
            // Проверка столкновений
            if (bird.y + bird.radius > canvas.height || bird.y - bird.radius < 0) {
                endGame();
            }
            
            for (let pipe of pipes) {
                if (bird.x + bird.radius > pipe.x && bird.x - bird.radius < pipe.x + PIPE_WIDTH) {
                    if (bird.y - bird.radius < pipe.gapY || bird.y + bird.radius > pipe.gapY + PIPE_GAP) {
                        endGame();
                    }
                }
            }
        }
        
        function draw() {
            // Небо
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#4ec0ca');
            gradient.addColorStop(0.7, '#87ceeb');
            gradient.addColorStop(1, '#ded895');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Облака
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            for (let i = 0; i < 3; i++) {
                const cx = ((frame * 0.5 + i * 150) % (canvas.width + 100)) - 50;
                ctx.beginPath();
                ctx.arc(cx, 80 + i * 40, 25, 0, Math.PI * 2);
                ctx.arc(cx + 20, 80 + i * 40, 30, 0, Math.PI * 2);
                ctx.arc(cx + 45, 80 + i * 40, 25, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Трубы
            for (let pipe of pipes) {
                // Верхняя труба
                const grad1 = ctx.createLinearGradient(pipe.x, 0, pipe.x + PIPE_WIDTH, 0);
                grad1.addColorStop(0, '#5cb85c');
                grad1.addColorStop(0.5, '#73d673');
                grad1.addColorStop(1, '#4a9d4a');
                ctx.fillStyle = grad1;
                ctx.fillRect(pipe.x, 0, PIPE_WIDTH, pipe.gapY);
                ctx.fillRect(pipe.x - 5, pipe.gapY - 20, PIPE_WIDTH + 10, 20);
                
                // Нижняя труба
                ctx.fillRect(pipe.x, pipe.gapY + PIPE_GAP, PIPE_WIDTH, canvas.height);
                ctx.fillRect(pipe.x - 5, pipe.gapY + PIPE_GAP, PIPE_WIDTH + 10, 20);
            }
            
            // Птица
            ctx.save();
            ctx.translate(bird.x, bird.y);
            ctx.rotate(Math.min(Math.max(bird.vy * 0.05, -0.5), 0.5));
            
            // Тело
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Крыло
            ctx.fillStyle = '#ffaa00';
            ctx.beginPath();
            ctx.ellipse(-5, 2, 8, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Глаз
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(6, -4, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(7, -4, 2.5, 0, Math.PI * 2);
            ctx.fill();
            
            // Клюв
            ctx.fillStyle = '#ff6b35';
            ctx.beginPath();
            ctx.moveTo(12, 0);
            ctx.lineTo(20, -2);
            ctx.lineTo(20, 4);
            ctx.closePath();
            ctx.fill();
            
            ctx.restore();
        }
        
        function endGame() {
            gameRunning = false;
            gameOver = true;
            if (tg) tg.HapticFeedback.notificationOccurred('error');
            
            overlay.classList.remove('hidden');
            overlay.innerHTML = `
                <h1>💀 Игра окончена!</h1>
                <p>Счёт: ${score}</p>
                <button id="restartBtn">ЗАНОВО</button>
            `;
            document.getElementById('restartBtn').addEventListener('click', startGame);
        }
        
        function startGame() {
            init();
            loop();
        }
        
        function loop() {
            if (!gameRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }
        
        // Управление
        canvas.addEventListener('click', jump);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });
        startBtn.addEventListener('click', startGame);
        
        // Начальная отрисовка
        init();
        gameRunning = false;
        draw();
    </script>
</body>
</html>y
